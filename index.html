<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indisponível</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body{
      background:#000;
      color:#fff;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .container{
      text-align:center;
      padding:20px;
    }

    .dot{
      width:10px;
      height:10px;
      background:#fff;
      border-radius:50%;
      margin:0 auto 20px;
      animation:pulse 1.5s infinite;
    }

    @keyframes pulse{
      0%{opacity:0.3; transform:scale(0.8);}
      50%{opacity:1; transform:scale(1.2);}
      100%{opacity:0.3; transform:scale(0.8);}
    }

    h1{
      font-size:22px;
      font-weight:500;
      letter-spacing:0.5px;
    }

    p{
      font-size:14px;
      color:#888;
      margin-top:8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="dot"></div>
    <h1>Temporariamente indisponível</h1>
  </div>
</body>
</html>
